
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GYS QR Scanner Test</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      text-align: center;
    }

    #reader {
      max-width: 500px;
      margin: 20px auto;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
      background: #eee;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>QR Scanner Test</h1>

  <div id="reader"></div>

  <div id="result">
    Waiting for QR code...
  </div>

  <script>
    function onScanSuccess(decodedText) {
      document.getElementById('result').textContent =
        'QR: ' + decodedText;
    }

    const scanner = new Html5QrcodeScanner(
      'reader',
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        },
        rememberLastUsedCamera: true
      },
      false
    );

    scanner.render(onScanSuccess);
  </script>

</body>
</html>
